name: halation-simulation

services:
  rosbridge:
    build:
      context: ./docker/simulation
    image: halation-rosbridge:humble
    ports:
      - "127.0.0.1:9095:9095"
    environment:
      ROS_DOMAIN_ID: "68"
      ROS_LOCALHOST_ONLY: "1"
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 9095), timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
